apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-app
          persistentVolumeClaim:
            claimName: app-claim
      containers:
        - name: todo-app
          image: patrick11211/todo-app:2.2
          volumeMounts:
          - name: shared-app
            mountPath: /usr/src/app/files
          env:
            - name: PORT
              value: "8080"