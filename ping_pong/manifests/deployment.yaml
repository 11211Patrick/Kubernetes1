apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-string
          persistentVolumeClaim:
            claimName: string-claim
      containers:
        - name: ping-pong
          image: patrick11211/ping-pong:1.11
          volumeMounts: # Mount volume
          - name: shared-string
            mountPath: /usr/src/app/files