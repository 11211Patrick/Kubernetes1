apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-string
          emptyDir: {}
      containers:
        - name: generate-string
          image: patrick11211/generate-string:1.10
          volumeMounts: # Mount volume
          - name: shared-string
            mountPath: /usr/src/app/files
        - name: read-string
          image: patrick11211/read-string:1.10
          volumeMounts: # Mount volume
          - name: shared-string
            mountPath: /usr/src/app/files
